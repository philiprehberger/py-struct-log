[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "philiprehberger-struct-log"
version = "0.2.0"
description = "Structured JSON logging with automatic context propagation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Philip Rehberger" }]
keywords = ["logging", "structured", "json", "context", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/philiprehberger/py-struct-log#readme"
Repository = "https://github.com/philiprehberger/py-struct-log"
Issues = "https://github.com/philiprehberger/py-struct-log/issues"
Changelog = "https://github.com/philiprehberger/py-struct-log/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/philiprehberger_struct_log"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
